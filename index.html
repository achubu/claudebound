/* Condensed battle status: everything you need to play the next card
 (turn/energy, both health bars, enemy intent) fits in a short block
 directly above the hand, instead of two tall full panels pushing the
 cards down. Player health is green, enemy health is red, side by side. */
.battle-compact{margin:6px 0 10px}
.compact-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.compact-bar .badge{padding:4px 8px;font-size:11px}
.compact-bar button{padding:4px 9px;font-size:11px}
.compact-combatants{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compact-side{padding:7px 9px;border:1px solid #66798c;background:#0c1825;border-radius:7px;min-width:0}
.compact-side.you{display:flex;flex-direction:column;justify-content:center;gap:3px}
.compact-side.enemy{border-color:#9b6464;display:flex;flex-direction:row;align-items:center;gap:6px}
.compact-monster{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:radial-gradient(circle,#23cfe22e 0,transparent 68%)}
.compact-monster img,.compact-monster svg{width:100%;height:100%;object-fit:contain}
.compact-enemy-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.compact-head{min-width:0}
.compact-head b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact-combatants .meter{position:relative;height:14px}
.compact-combatants .meter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;text-shadow:0 1px 2px #000c;pointer-events:none;font-style:normal}
.compact-tags{display:flex;gap:6px;flex-wrap:wrap;min-height:1px}
.compact-tags .armor-tag,.compact-tags .block-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:#162530}
.ability.small{padding:3px 7px;font-size:10px}
.meter.you span{background:#5ecb50}
.meter.enemy span{background:#c9655e}
.battle-compact>.intent{padding:6px 10px;font-size:12px;margin:0}
.battle-compact>.intent small{display:block;font-size:10px;opacity:.8;margin-top:2px}
.battle-monster{height:210px;display:grid;place-items:center;margin:-5px 0 4px;background:radial-gradient(circle,#23cfe22e 0,transparent 68%);overflow:hidden}.monster-sprite{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 12px 7px #000b) drop-shadow(0 0 12px #36ddea55)}

 m.innerHTML='<div class="battle-compact"><div class="compact-bar"><span class="badge">Turn '+b.turn+'</span><span class="badge">⚡ '+b.energy+'/'+maxEnergy()+'</span><span class="badge">Lv '+state.playerLevel+' · '+state.xp+'/100 XP</span><button id="battleChar">Character</button></div><div class="compact-combatants"><div class="compact-side you"><div class="compact-head"><b>YOU</b></div><div class="meter you"><span style="width:'+state.hp/state.maxHp*100+'%"></span><i class="meter-label">'+state.hp+'/'+state.maxHp+'</i></div><div class="compact-tags">'+(b.block?'<b class="block-tag" title="Block absorbs the next '+b.block+' damage you take, then runs out.">◈ '+b.block+' Block</b>':'')+(hasTalent('weakenCore')&&!b.debuffUsed?'<button id="weaken" class="ability small">Weaken · Enemy −'+weakenAmount()+'</button>':hasTalent('weakenCore')?'<span class="soul-legend">Weaken: −'+b.enemyDebuff+' attack</span>':'')+'</div></div><div class="compact-side enemy"><div class="compact-monster">'+monsterArt(b.id)+'</div><div class="compact-enemy-info"><div class="compact-head"><b>'+(b.enemy.boss?'★ ':'')+b.enemy.name+(typeof b.enemy.level==='number'?' <span class="enemy-level" style="color:'+levelColor(b.enemy.level)+'">Lv.'+b.enemy.level+'</span>':'')+'</b></div><div class="meter enemy"><span style="width:'+b.enemy.hp/b.enemy.maxHp*100+'%"></span><i class="meter-label">'+b.enemy.hp+'/'+b.enemy.maxHp+'</i></div><div class="compact-tags">'+(b.enemy.armor?'<b class="armor-tag" title="Armor blocks '+b.enemy.armor+' damage from every non-Pierce hit. Pierce cards ignore it.">🛡 '+b.enemy.armor+' Armor</b>':'')+(b.enemy.guard?'<b class="block-tag" title="Block absorbs the next '+b.enemy.guard+' damage you deal, then runs out.">◈ '+b.enemy.guard+' Block</b>':'')+'</div></div></div></div><div class="intent">'+(b.turn%3===0?'Heavy attack':'Attack')+': <b>'+intent()+' damage</b></div></div><div class="hand-title"><h2>Your hand</h2><span class="muted">Click a card to play</span></div><div clas  b.hand.forEach((c,i)=>{const wrap=cardElement(c,()=>playCard(i),stat(c).cost>b.energy);if(hasTalent('powerCore')){const d=stat(c),boost=document.createElement('button'),selected=boostedCardUids(b),isBoosted=selected.includes(c.uid),slots=boostCharges()-selected.length;boost.className='ability'+(isBoosted?' selected':'');boost.textContent=isBoosted?'✓ Boosted for encounter · +'+boostAmount():slots>0?'Power Boost +'+boostAmount()+' · lasts encounter':'Power Boost slots full';boost.disabled=(!isBoosted&&slots<=0)||!(d.damage||d.block||d.heal);boost.onclick=()=>{const next=boostedCardUids(b);b.boostedUids=next.includes(c.uid)?next.filter(id=>id!==c.uid):next.length<boostCharges()?[...next,c.uid]:next;b.boostedUid=null;b.boostUses=b.boostedUids.length;save();renderBattle()};wrap.append(boost)}if(hasTalent('retainCore')){const keep=document.createElement('button');keep.className='ability'+(b.savedUid===c.uid?' selected':'');keep.textContent=b.savedUid===c.uid?'✓ Retained':'Retain this card';keep.onclick=()=>{b.savedUid=b.savedUid===c.uid?null:c.uid;save();renderBattle()};wrap.append(keep)}if(hasTalent('cloneCore')){const clone=document.createElement('button');clone.className='ability';clone.textContent=b.cloneUsed?'Mirror Array spent':'Clone this card';clone.disabled=b.cloneUsed;clone.onclick=()=>{if(b.cloneUsed)return;b.cloneUsed=true;const dup=make(c.id,c.level,false);b.draw=shuffle([...b.draw,dup]);b.logs.push('Mirror Array: cloned '+stat(c).name+' into the draw pile.');save();renderBattle()};wrap.append(clone)}$('hand').append(wrap)});if($('weaken'))$('weaken').onclick=()=>{b.debuffUsed=true;b.enemyDebuff=weakenAmount();b.logs.push('Weaken: enemy attack −'+b.enemyDebuff+' this encounter.');save();renderBattle()};$('endTurn').onclick=endTurn;$('battleChar').onclick=showCharacter}

function showMap(){const w=880,h=560,cells=[];for(const [k,r] of Object.entries(rooms)){const p=roomPoint(k,w,h,54),seen=state.visited.includes(k),cleared=seen&&roomCleared(k);cells.push('<div class="map-room '+(k===state.room?'current ':'')+(!seen?'unknown':'')+'" style="left:'+p.x+'px;top:'+p.y+'px">'+(seen?r.name:'?')+(seen?'<span class="map-status">'+(k===state.room?'YOU ARE HERE':cleared?'SECURE':'DANGER')+'</span>':'')+'</div>')}const discovered=state.visited.filter(k=>rooms[k]).length;openMenu('<div class="eyebrow">EXPLORATION MAP · M TO CLOSE</div><h2>Neon Aftermath · '+discovered+'/'+Object.keys(rooms).length+' discovered</h2><p class="muted">The city branches, loops, and reconnects. Discover 24 areas across six districts. Red routes require relics.</p><div class="world-map"><div class="map-surface">'+graphLinks(w,h,54,true)+cells.join('')+'</div></div><div class="map-key"><span>Gold border: current</span><span>Blue: explored</span><span>Dark: unknown</span><span>Crimson: sealed route</span></div><p>Relics: '+(state.relics.length?state.relics.map(x=>x==='ember'?'✹ Ember Sigil':x==='boots'?'♜ Briarstep Boots':'◉ Moon Lens').join(' · '):'None yet')+'</p><button id="closeMenu" class="primary">Return</button>');$('closeMenu').onclick=closeMenu;fitMap()}
function fitMap(){const map=document.querySelector('.world-map, .region-map'),surface=document.querySelector('.map-surface');if(map&&surface){const scale=Math.min(map.clientWidth/880,map.clientHeight/560);surface.style.transform='translate(-50%,-50%) scale('+scale+')'}}
function talentNodeHTML(branch,node){const rank=talentRank(node.id),available=talentAvailable(branch,node),learned=rank>0,maxed=rank>=node.max,tierNeed=TALENT_TIERS[node.tier],reason=maxed?'Maximum rank':branchSpent(branch)<tierNeed?'Requires '+tierNeed+' points in '+TALENT_BRANCHES[branch].name:node.req&&talentRank(node.req[0])<node.req[1]?'Previous talent requires rank '+node.req[1]:talentPoints()<1?'Gain a level for another point':'Spend one talent point';
 // WoW Classic-style compact icon node: the icon and rank pips are always
 // visible, name/description/requirement move into a hover/focus tooltip
 // instead of permanently occupying space — this is what lets a whole
 // branch read as a real tree (rows + connecting lines) instead of a
 // scrolling list of wide cards.
 const pips=node.max>1?'<span class="talent-pips">'+Array.from({length:node.max},(_,i)=>'<i class="'+(i<rank?'lit':'')+'"></i>').join('')+'</span>':'';
 return '<button class="talent-node '+(learned?'learned ':'')+(maxed?'maxed ':'')+(available?'available':'locked')+'" data-branch="'+branch+'" data-talent="'+node.id+'" data-tier="'+node.tier+'" '+(available?'':'disabled')+'><span class="talent-icon">'+node.icon+'</span>'+(node.max===1?'<span class="talent-rank-badge">'+(learned?'✓':'')+'</span>':'<span class="talent-rank-badge">'+rank+'/'+node.max+'</span>')+pips+'<span class="talent-tooltip"><b>'+node.name+'</b><span class="talent-tooltip-desc">'+node.desc+'</span><span class="talent-tooltip-rank">Rank '+rank+'/'+node.max+'</span><em>'+reason+'</em></span></button>'}
function talentRowsHTML(key,branch){
 // Group nodes by tier into rows (tier 0 at top, deeper tiers further
 // down) instead of one flat list — this is what makes the branch read
 // as an actual tree with rows, not a scrolling stack of wide cards.
 const maxTier=Math.max(...branch.nodes.map(n=>n.tier)),rows=[];
 for(let t=0;t<=maxTier;t++){
  const atTier=branch.nodes.filter(n=>n.tier===t);
  if(atTier.length)rows.push('<div class="talent-row">'+atTier.map(node=>talentNodeHTML(key,node)).join('')+'</div>');
 }
 return rows.join('');
}
function renderTalentConnectors(){
 // Draws a line from every talent to the prerequisite it depends on,
 // using each node's REAL rendered position (same approach as the
 // exploration map's connector lines) rather than precomputed grid math
 // — this adapts automatically to however many nodes land in a row and
 // works even for a same-tier dependency. querySelectorAll safely
 // returns nothing outside a real browser, so this is a no-op in the
 // test harness rather than throwing.
 document.querySelectorAll('.talent-branch').forEach(branchEl=>{
  const key=[...branchEl.classList].find(c=>TALENT_BRANCHES[c]),branch=TALENT_BRANCHES[key];
  const lane=branchEl.querySelector('.talent-lane');
  if(!branch||!lane)return;
  const old=lane.querySelector('.talent-connectors');if(old)old.remove();
  const laneBox=lane.getBoundingClientRect();
  if(!laneBox.width||!laneBox.height)return;
  let svg='<svg class="talent-connectors" xmlns="http://www.w3.org/2000/svg">';
  branch.nodes.forEach(node=>{
   if(!node.req)return;
   const childEl=lane.querySelector('[data-talent="'+node.id+'"]'),parentEl=lane.querySelector('[data-talent="'+node.req[0]+'"]');
   if(!childEl||!parentEl)return;
   const c=childEl.getBoundingClientRect(),p=parentEl.getBoundingClientRect();
   const x1=p.left-laneBox.left+p.width/2,y1=p.top-laneBox.top+p.height,x2=c.left-laneBox.left+c.width/2,y2=c.top-laneBox.top;
   const lit=talentRank(node.req[0])>=node.req[1];
   svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="'+(lit?'connector-lit':'connector-dim')+'"/>';
  });
  svg+='</svg>';
  lane.insertAdjacentHTML('afterbegin',svg);
 });
}
function showCharacter(){const counts=[0,0,0,0];state.pool.forEach(c=>counts[c.level]++);const tree=Object.entries(TALENT_BRANCHES).map(([key,branch])=>'<section class="talent-branch '+key+'"><h3>'+branch.icon+' '+branch.name+'</h3><div class="branch-spend">'+branchSpent(key)+' POINTS · '+branch.subtitle+'</div><div class="talent-lane">'+talentRowsHTML(key,branch)+'</div></section>').join(''),atCap=state.playerLevel>=MAX_PLAYER_LEVEL;openMenu('<img class="hero-portrait sheet-portrait" src="assets/characters/protagonist.jpeg" alt="Protagonist"><div class="eyebrow">CHARACTER · LEVEL 1–30 PROGRESSION</div><h2>'+state.name+' · Level '+state.playerLevel+(atCap?' · MAX':'')+'</h2><div class="sheet-grid"><div class="panel"><b>Experience</b><p>'+(atCap?'Maximum level reached':state.xp+'/100 XP to Level '+(state.playerLevel+1))+'</p><div class="track"><span style="width:'+(atCap?100:state.xp)+'%"></span></div></div><div class="panel"><b>Battle loadout</b><p>'+maxEnergy()+' energy · '+openingHand()+' opening cards<br>Boost '+(hasTalent('powerCore')?'+'+boostAmount()+' × '+boostCharges():'locked')+' · Weaken '+(hasTalent('weakenCore')?'−'+weakenAmount():'locked')+'<br>Starting Block '+talentRank('plating')+' · Deck '+maxDeckSize()+' · Copies '+maxCopies()+'<br>Potion heal '+potionHeal()+' · Potions '+state.potions+'</p></div><div class="panel"><b>Card upgrades</b><p>Lv0 '+counts[0]+' · Lv1 '+counts[1]+' · Lv2 '+counts[2]+' · Lv3 '+counts[3]+'</p></div><div class="panel"><b>Exploration relics</b><p>'+(state.relics.length?state.relics.join(' · '):'None')+'</p></div></div><div class="talent-header"><div><h2>Neural Talent Matrix</h2><p class="muted">Gain one point every level from 2–30. Invest within a branch to unlock deeper rows.</p></div><span class="talent-points">'+talentPoints()+' AVAILABLE · '+talentSpent()+'/29 SPENT</span></div><div class="talent-tree">'+tree+'</div><div class="talent-footer"><button id="resetTalents" class="danger" '+(talentSpent()?'':'disabled')+'>Recompile talent tree</button><button id="closeMenu" class="primary">Return</button></div>');document.querySelectorAll('[data-talent]').forEach(button=>button.onclick=()=>spendTalent(button.dataset.branch,button.dataset.talent));$('resetTalents').onclick=resetTalents;$('closeMenu').onclick=closeMenu;renderTalentConnectors()}
function showDeck(){const soul=state.pool.filter(c=>c.soulbound).length,ready=state.pool.filter(c=>c.level<3&&c.uses>=USES).length;openMenu('<div class="eyebrow">DECK WORKSHOP</div><h2>Build and master your deck</h2><div class="workshop"><div class="panel"><b>Active deck '+state.deck.length+'/'+maxDeckSize()+'</b><p class="muted">Blue outlines mark active cards. Minimum '+MIN_DECK+' · Maximum '+maxDeckSize()+' · '+maxCopies()+' copies per card.</p><div class="deck-list" id="deckList"></div><p>◆ Upgrade crystals: '+materials()+'</p></div><div class="panel"><p><span class="soul-legend">◆ Soulbound · Protected</span> &nbsp; <span class="imp-legend">◇ Impermanent · At Risk</span></p><div class="filters" id="filters"><button data-f="all">All '+state.pool.length+'</button><button data-f="active">Active '+state.deck.length+'</button><button data-f="soul">Soulbound '+soul+'</button><button data-f="imp">Impermanent '+(state.pool.length-soul)+'</button><button data-f="ready">Ready '+ready+'</button></div><div class="cards" id="poolCards"></div></div></div><p><button id="closeMenu" class="primary">Return</button></p>');$('deckList').innerHTML=active().map(c=>'<div class="deck-slot '+(c.soulbound?'soul':'')+'">'+(c.soulbound?'◆':'◇')+' '+stat(c).name+' · Lv '+c.level+' · '+c.uses+'/50</div>').join('');$('filters').querySelectorAll('button').forEach(b=>{b.classList.toggle('selected',b.dataset.f===poolFilter);b.onclick=()=>{poolFilter=b.dataset.f;showDeck()}});const shown=state.pool.filter(c=>poolFilter==='all'||poolFilter==='active'&&state.deck.includes(c.uid)||poolFilter==='soul'&&c.soulbound||poolFilter==='imp'&&!c.soulbound||poolFilter==='ready'&&c.level<3&&c.uses>=USES);shown.forEach(c=>{const wrap=cardElement(c,()=>{});wrap.firstChild.classList.toggle('active',state.deck.includes(c.uid));const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.textContent=state.deck.includes(c.uid)?'− Remove from deck':'+ Add to deck';toggle.onclick=()=>{if(state.deck.includes(c.uid)){if(state.deck.length<=MIN_DECK)return toast('Keep at least '+MIN_DECK+' active cards.');state.deck=state.deck.filter(id=>id!==c.uid)}else{if(state.deck.length>=maxDeckSize())return toast('Deck Matrix currently allows '+maxDeckSize()+' cards.');if(copiesInDeck(c.id)>=maxCopies())return toast('Pattern Replication currently allows '+maxCopies()+' copies of '+stat(c).name+'.');state.deck.push(c.uid)}save();showDeck()};const up=document.createElement('button');up.textContent=c.level>=3?'Maximum level':c.uses>=USES?'Upgrade · 1 crystal':'Locked · '+c.uses+'/50 uses';up.disabled=c.level>=3;up.onclick=()=>{if(c.uses<USES)return toast('This card needs '+(USES-c.uses)+' more uses.');if(materials()<1)return toast('Find the hidden Upgrade Crystal in the ruined city.');setMaterials(materials()-1);c.level++;c.uses=0;save();showDeck()};const destroy=document.createElement('button');destroy.className='danger';destroy.textContent=c.soulbound?'Soulbound protected':'Destroy card';destroy.disabled=c.soulbound;destroy.onclick=()=>{if(state.deck.includes(c.uid)&&state.deck.length<=MIN_DECK)return toast('Replace this active card first.');state.pool=state.pool.filter(x=>x.uid!==c.uid);state.deck=state.deck.filter(id=>id!==c.uid);save();showDeck()};actions.append(toggle,up,destroy);wrap.append(actions);$('poolCards').append(wrap)});$('closeMenu').onclick=closeMenu}

let heroFacing=0,heroWalkTime=0;
function animateHero(dt,moved){
 const p=$('player');if(!p)return;
 if(moved){const dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);heroFacing=dx?(dx<0?1:2):(dy<0?3:0);heroWalkTime+=dt}else heroWalkTime=0;
 p.classList.toggle('walking',moved);
 const frame=moved?Math.floor(heroWalkTime/.12)%4:0;

}
