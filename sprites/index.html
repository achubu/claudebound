<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textures · Aethercede</title>
<!-- Round 421 (owner: "add a page called textures that lists them all and groups them by category at aethercede.com/sprites").
     Reads manifest.json (tools/build-sprites-manifest.cjs builds it from CITY_SURFACES and CITY_TD_ART). -->
<style>
  :root { --bg: #0b0f17; --panel: #131a26; --line: #243041; --ink: #e8edf5; --muted: #8d9bb0; --accent: #36f1ff; --warm: #ffcf7a; --no: #ff7a8a; --yes: #6fe0a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 20px 12px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  nav .in { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  nav a { color: var(--ink); text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  nav a:hover { border-color: var(--accent); }
  nav input { margin-left: auto; min-width: 180px; flex: 0 1 240px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 20px 60px; }
  h2.world { margin: 26px 0 0; font-size: 26px; color: var(--accent); scroll-margin-top: 60px; }
  h3.cat { margin: 26px 0 6px; font-size: 20px; scroll-margin-top: 60px; }
  h2 small, h3 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  section.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .item-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .item-head h4 { margin: 0; font-size: 16px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .walk { color: var(--yes); } .nowalk { color: var(--no); }
  .meta { color: var(--muted); font-size: 13px; }
  .rule { margin: 6px 0 10px; color: #c5cfdd; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; background: #0e141e; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; }
  figure .pic { aspect-ratio: 1; display: grid; place-items: center; padding: 8px;
    background: repeating-conic-gradient(#1a2230 0% 25%, #141b27 0% 50%) 50% / 16px 16px; }
  figure img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
  figcaption { padding: 6px 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  figcaption b { color: var(--ink); font-weight: 600; display: block; }
  .tag { color: var(--warm); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 12px; max-width: min(92vw, 1100px); }
  dialog::backdrop { background: #000c; }
  dialog img { max-width: 100%; max-height: 78vh; display: block; margin: 0 auto;
    background: repeating-conic-gradient(#1a2230 0% 25%, #141b27 0% 50%) 50% / 20px 20px; }
  dialog p { margin: 8px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
  .empty { color: var(--muted); }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); } h1 { font-size: 24px; } }
</style>
</head>
<body>
<header>
  <h1>Textures</h1>
  <p id="note">Loading…</p>
</header>
<nav><div class="in" id="nav"><input id="q" type="search" placeholder="Filter by name…" aria-label="Filter textures by name"></div></nav>
<main id="main"></main>
<dialog id="zoom"><img id="zimg" alt=""><p id="zcap"></p></dialog>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kb = n => n ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB' : '';
fetch('manifest.json', { cache: 'no-store' }).then(r => r.json()).then(m => {
  document.title = m.title + ' · Aethercede';
  const count = c => c.types.reduce((d, t) => d + t.files.length, 0), total = m.worlds.reduce((a, w) => a + w.categories.reduce((b, c) => b + count(c), 0), 0);
  document.getElementById('note').innerHTML = esc(m.note) + ' ' + total + ' pictures. <a href="../">Back to the game</a>';
  const nav = document.getElementById('nav'), main = document.getElementById('main'), q = document.getElementById('q');
  // world, then category, then type, then the pictures by name
  m.worlds.forEach((w, wi) => {
    let html = '<h2 class="world" id="w' + wi + '">' + esc(w.name) + ' <small>' + w.categories.reduce((b, c) => b + count(c), 0) + ' pictures</small></h2>';
    w.categories.forEach((c, ci) => {
      const id = 'w' + wi + 'c' + ci, a = document.createElement('a'); a.href = '#' + id; a.textContent = c.title.replace(/ \(.*\)/, ''); nav.insertBefore(a, q);
      html += '<h3 class="cat" id="' + id + '">' + esc(c.title) + ' <small>' + c.types.length + ' types · ' + count(c) + ' pictures</small></h3>';
      for (const it of c.types) {
        const walk = it.walk == null ? '' : '<span class="badge ' + (it.walk ? 'walk">walkable' : 'nowalk">blocks the way') + '</span>';
        html += '<section class="item"><div class="item-head"><h4>' + esc(it.label) + '</h4>' + walk + '<span class="meta">' + esc(it.folder) + (it.scale ? ' · drawn at ' + it.scale : '') + ' · ' + it.files.length + '</span></div>'
          + '<p class="rule">' + esc(it.rule) + '</p><div class="grid">'
          + (it.files.length ? it.files.map(f => '<figure data-name="' + esc(f.name.toLowerCase()) + '" data-src="../' + esc(f.src) + '"><div class="pic"><img loading="lazy" src="../' + esc(f.src) + '" alt="' + esc(f.name) + '"></div><figcaption><b>' + esc(f.name) + '</b><span class="dim"></span>' + (f.role ? ' <span class="tag">' + esc(f.role) + '</span>' : '') + ' ' + kb(f.bytes) + '</figcaption></figure>').join('') : '<p class="empty">No picture yet.</p>')
          + '</div></section>';
      }
    });
    const wrap = document.createElement('div'); wrap.innerHTML = html; main.append(wrap);
  });
  main.querySelectorAll('figure img').forEach(img => { const set = () => { const d = img.closest('figure').querySelector('.dim'); if (d && img.naturalWidth) d.textContent = img.naturalWidth + '×' + img.naturalHeight + ' · '; }; img.complete ? set() : img.addEventListener('load', set, { once: true }); });
  const zoom = document.getElementById('zoom');
  main.addEventListener('click', e => { const f = e.target.closest('figure'); if (!f) return; document.getElementById('zimg').src = f.dataset.src; document.getElementById('zcap').textContent = f.dataset.src.replace('../', ''); zoom.showModal(); });
  zoom.addEventListener('click', () => zoom.close());
  q.addEventListener('input', () => { const v = q.value.trim().toLowerCase(); main.querySelectorAll('figure').forEach(f => { f.style.display = !v || f.dataset.name.includes(v) ? '' : 'none'; });
    main.querySelectorAll('section.item').forEach(s => { s.style.display = [...s.querySelectorAll('figure')].some(f => f.style.display !== 'none') || !v ? '' : 'none'; }); });
}).catch(() => { document.getElementById('note').textContent = 'Could not load the texture list.'; });
</script>
</body>
</html>
